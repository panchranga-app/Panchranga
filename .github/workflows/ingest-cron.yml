name: Panchranga Scheduled Ingestion & Clustering Pipeline

on:
  schedule:
    # Run every 30 minutes (48 runs/day to conserve Supabase Egress & Log Ingestion quotas)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: panchranga-pipeline
  cancel-in-progress: false

jobs:
  ingest-and-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Send Daily Newsletter (Sharp 7:00 AM IST via workflow_dispatch)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || secrets.SITE_URL || 'https://panchranga.app' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_DAILY_LIMIT: ${{ secrets.GMAIL_DAILY_LIMIT }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          BREVO_DAILY_LIMIT: ${{ secrets.BREVO_DAILY_LIMIT }}
          BREVO_ENABLED: ${{ secrets.BREVO_ENABLED }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_DAILY_LIMIT: ${{ secrets.RESEND_DAILY_LIMIT }}
          EMAIL_PROVIDER_ORDER: ${{ secrets.EMAIL_PROVIDER_ORDER }}
        run: |
          IST_HOUR=$(TZ="Asia/Kolkata" date +%-H)
          if [ "$IST_HOUR" -ge 7 ]; then
            echo "⏰ Current IST hour is $IST_HOUR (>= 7 AM IST). Running idempotent daily newsletter check..."
            npm run send-newsletter
          else
            echo "⏳ Current IST hour is $IST_HOUR (< 7 AM IST). Skipping daily newsletter until 7:00 AM IST."
          fi

      - name: Cache API Anything Package
        id: cache-api-anything
        uses: actions/cache@v4
        with:
          path: /tmp/api-anything-pkg
          key: api-anything-v1-${{ runner.os }}

      - name: Setup API Anything CLI
        run: |
          if [ ! -f /tmp/api-anything-pkg/api-anything.tgz ]; then
            mkdir -p /tmp/api-anything-pkg
            git clone -q --depth 1 https://github.com/goodnight000/api-anything.git /tmp/api-anything-src
            cd /tmp/api-anything-src
            npm ci --no-audit --no-fund
            archive="$(npm pack --silent)"
            mv "$archive" /tmp/api-anything-pkg/api-anything.tgz
          fi
          npm install -g /tmp/api-anything-pkg/api-anything.tgz
          api-anything --help

      - name: Sync Sources & Run Panchranga Pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run seed && npm run pipeline
